# Squid proxy configuration for Claudebox
# Provides allowlist-based network access control

# Basic settings
http_port 3128
visible_hostname claudebox-proxy

# Access logging
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# Disable caching (we're just a security proxy)
cache deny all

# Allowlist file (mounted from host directory to handle file replacement)
acl allowlist dstdomain "/etc/squid/host-config/allowlist.conf"

# Block non-HTTPS for security (except to proxy itself)
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Deny non-standard ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Allow localhost (for health checks) - uses built-in localhost ACL
http_access allow localhost

# Allow only allowlisted domains
http_access allow allowlist
http_access deny all

# Custom error page for blocked domains
deny_info ERR_BLOCKED_DOMAIN all

# Rate limiting to prevent bulk exfiltration
# Limit to 100 requests per minute per client
acl rate_limit_clients src all
delay_pools 1
delay_class 1 1
delay_parameters 1 64000/64000
delay_access 1 allow rate_limit_clients

# Payload size limit - prevents large bulk exfiltration in single request
# 50MB allows Claude's API calls with file context while limiting abuse
request_body_max_size 50 MB

# Security: Hide internal network info
forwarded_for delete
via off

# Timeouts
connect_timeout 30 seconds
read_timeout 60 seconds
request_timeout 60 seconds

# Memory limits
cache_mem 64 MB
maximum_object_size 10 MB
maximum_object_size_in_memory 512 KB

# PID file
pid_filename /var/run/squid/squid.pid

# Coredump directory
coredump_dir /var/cache/squid
