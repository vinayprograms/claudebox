# Claudebox Proxy Allowlist
# =========================
# This file controls which domains the Claude Code container can access.
# Only domains listed here (or matching patterns) will be reachable.
#
# Format:
#   - Exact domain: example.com
#   - Subdomain wildcard: .example.com (matches *.example.com)
#   - Comments start with #
#
# The proxy will return HTTP 403 with a helpful error message for blocked domains.

# === REQUIRED (Claude Code - do not remove) ===
# Anthropic services (API, docs, etc.)
.anthropic.com
# Claude authentication and platform
.claude.ai
.claude.com

# === WebSearch (required for WebSearch tool) ===
.google.com
.googleapis.com

# === Network MCPs ===
# Add your MCP server domains here. Uncomment and modify as needed.
# mcp.linear.app
# github-mcp.mycompany.com
# mcp.yourcompany.internal

# === Git Hosting ===
# Add git hosts you need to push/pull from
github.com
gitlab.com
# bitbucket.org
# git.mycompany.internal

# === Package Registries (uncomment if needed for builds) ===
# registry.npmjs.org
# pypi.org
# proxy.golang.org
# sum.golang.org

# === Documentation / Reference (optional) ===
# docs.anthropic.com
# stackoverflow.com
# developer.mozilla.org
